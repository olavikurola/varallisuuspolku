# Kääntää allekirjoitetun iOS-appin pilvi-Macilla ja lähettää sen TestFlightiin.
#
# Vaatii neljä GitHub-secretiä (ohjeet: appi/README-appi.md):
#   APPSTORE_KEY_ID     – App Store Connect API-avaimen Key ID
#   APPSTORE_ISSUER_ID  – saman avaimen Issuer ID
#   APPSTORE_P8         – .p8-avaintiedoston koko sisältö
#   APPLE_TEAM_ID       – Apple Developer -tiimin ID (Membership-sivu)
#
# Allekirjoitus: Xcoden pilviallekirjoitus (-allowProvisioningUpdates + API-avain)
# luo ja hallinnoi jakelusertifikaatin ja profiilin automaattisesti — mitään
# sertifikaatteja ei säilytetä reposissa eikä secreteissä.
#
# Buildinumero = GitHub-ajon juokseva numero → aina nouseva, ei törmäyksiä.
# Käynnistys: GitHub → Actions → "Appi – iOS TestFlight" → Run workflow.
name: Appi – iOS TestFlight

on:
  workflow_dispatch:

jobs:
  testflight:
    # macos-latest: macos-15-pooli jumitti 6.8.2026 ("job was not acquired by
    # Runner") — tuorein pooli on vähemmän altis jonoille, Xcode 26 löytyy
    runs-on: macos-latest
    timeout-minutes: 60
    env:
      KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
      ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
      TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
    steps:
      - name: Tarkista salaisuudet
        run: |
          puuttuu=""
          [ -n "$KEY_ID" ] || puuttuu="$puuttuu APPSTORE_KEY_ID"
          [ -n "$ISSUER_ID" ] || puuttuu="$puuttuu APPSTORE_ISSUER_ID"
          [ -n "$TEAM_ID" ] || puuttuu="$puuttuu APPLE_TEAM_ID"
          [ -n "${{ secrets.APPSTORE_P8 }}" ] || puuttuu="$puuttuu APPSTORE_P8"
          if [ -n "$puuttuu" ]; then
            echo "::error::GitHub-secretit puuttuvat:$puuttuu — lisää ne (ohjeet appi/README-appi.md) ja aja uudelleen."
            exit 1
          fi

      - uses: actions/checkout@v4

      # Applen validointi vaatii iOS 26 SDK:n (huhtikuusta 2026) — runnerin
      # oletus-Xcode on vanhempi, joten valitaan koneen uusin Xcode 26.
      - name: Valitse Xcode 26
        run: |
          XC=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          if [ -z "$XC" ]; then
            echo "::error::Runnerilta ei löytynyt Xcode 26:ta (/Applications/Xcode_26*.app) — tarkista runner-imagen Xcode-versiot."
            ls -d /Applications/Xcode*.app
            exit 1
          fi
          sudo xcode-select -s "$XC/Contents/Developer"
          xcodebuild -version

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: appi/package-lock.json

      - name: Asenna riippuvuudet
        working-directory: appi
        run: npm ci

      - name: Kokoa www tuotantotiedostoista ja kopioi iOS-projektiin
        working-directory: appi
        run: npm run sync:ios

      - name: Kirjoita API-avain levylle
        run: |
          mkdir -p "$RUNNER_TEMP/keys"
          printf '%s' "${{ secrets.APPSTORE_P8 }}" > "$RUNNER_TEMP/keys/AuthKey_$KEY_ID.p8"

      # Arkisto tehdään ILMAN allekirjoitusta: automaattinen allekirjoitus
      # arkistointivaiheessa vaatisi kehitysprofiilin, joka taas vaatii
      # vähintään yhden rekisteröidyn laitteen tiimille. Vientivaihe
      # allekirjoittaa App Store -jakeluprofiililla, jolla laitevaatimusta
      # ei ole — pilviallekirjoitus luo sertifikaatin ja profiilin itse.
      - name: Arkistoi (Release, ei allekirjoitusta)
        working-directory: appi/ios/App
        run: |
          set -o pipefail
          xcodebuild -project App.xcodeproj -scheme App -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/App.xcarchive" archive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            CURRENT_PROJECT_VERSION="${{ github.run_number }}"

      - name: Vie ja lähetä TestFlightiin (pilviallekirjoitus)
        working-directory: appi/ios/App
        run: |
          set -o pipefail
          # teamID mukaan vientiasetuksiin secretistä — ei kovakoodata repoon
          cp ExportOptions.plist "$RUNNER_TEMP/ExportOptions.plist"
          /usr/libexec/PlistBuddy -c "Add :teamID string $TEAM_ID" "$RUNNER_TEMP/ExportOptions.plist"
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -exportPath "$RUNNER_TEMP/export" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/keys/AuthKey_$KEY_ID.p8" \
            -authenticationKeyID "$KEY_ID" \
            -authenticationKeyIssuerID "$ISSUER_ID"

      # Diagnostiikka: näkyykö App Group allekirjoitetussa paketissa (appi + widget)?
      # Widget lukee tietonsa ryhmästä — jos entitlementti puuttuu, silta ei toimi.
      - name: Näytä entitlementit (diagnostiikka)
        run: |
          cd "$RUNNER_TEMP/export"
          IPA=$(ls *.ipa | head -1)
          unzip -q "$IPA" -d ipa
          APP=$(ls -d ipa/Payload/*.app | head -1)
          echo "=== Appin entitlementit ==="
          codesign -d --entitlements :- "$APP" || true
          echo "=== Widgetin entitlementit ==="
          codesign -d --entitlements :- "$APP/PlugIns/VarallisuusWidget.appex" || true

      - name: Valmis
        run: echo "Lähetetty App Store Connectiin — build näkyy TestFlightissa käsittelyn (~5–15 min) jälkeen."
